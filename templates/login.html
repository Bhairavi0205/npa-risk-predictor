<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — NPA Predictor</title>
<style>
  :root {
    --card: #161c2c;
    --card-border: #262e42;
    --accent: #4f7cff;
    --accent-2: #7c5cff;
    --text: #e7ebf5;
    --muted: #8a91a8;
    --danger: #ff5c7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at top, #1a2138 0%, #0f1420 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .logo {
    text-align: center;
    font-weight: 800;
    font-size: 20px;
    margin-bottom: 6px;
  }
  .logo span { color: var(--accent); }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 4px 0 28px;
    color: var(--muted);
    font-weight: 500;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: #0f1420;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }
  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 42px;
  }
  .toggle-eye {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    user-select: none;
    opacity: 0.6;
    transition: opacity .15s;
  }
  .toggle-eye:hover { opacity: 1; }
  button {
    width: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    color: white;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,124,255,0.35); }
  .switch {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--muted);
  }
  .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .error {
    background: rgba(255,92,122,0.12);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 18px;
    text-align: center;
  }
  .back-link { text-align: center; margin-bottom: 20px; }
  .back-link a { color: var(--muted); text-decoration: none; font-size: 13px; }
</style>
</head>
<body>

<div class="card">
  <div class="back-link"><a href="/">&larr; Back to Home</a></div>
  <div class="logo">NPA <span>Predictor</span></div>
  <h1>Welcome back</h1>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" name="password" id="password" required>
        <span class="toggle-eye" onclick="togglePassword()">👁️</span>
      </div>
    </div>
    <button type="submit">Log In</button>
  </form>

  <div class="switch">
    Don't have an account? <a href="/signup">Sign up</a>
  </div>
</div>

<script>
function togglePassword() {
  const input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}
</script>

</body>
</html>
